  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="190" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="1120" cy="610" r="230" fill="#FFFFFF" opacity="0.05"/>
